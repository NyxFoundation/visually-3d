name: ✨ Feature request
description: Suggest a new capability or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or pain point behind the request.
      placeholder: "I'm always trying to … but there's no way to …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. A CLI flag? A viewer feature? A schema field?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: CLI (create / improve / check / upload)
        - label: 3D viewer / frontend
        - label: Scene schema
        - label: Self-improvement loop
        - label: Docs
