name: 🤖 New sample scene request
description: Suggest a machine that should be in the gallery (or flag a bad render).
labels: ["sample-scene"]
body:
  - type: markdown
    attributes:
      value: |
        Want to add it yourself? It's one command:
        ```
        visually create "<machine>" && visually improve <id> && visually upload <id>
        ```
        Use this issue if you'd rather just suggest it, or report that an existing scene renders poorly.
  - type: input
    id: machine
    attributes:
      label: Machine
      description: The machine/device to model.
      placeholder: "James Webb Space Telescope"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Vehicles
        - Aerospace
        - Robotics
        - Manufacturing
        - Energy
        - Medical
        - Defense / RF
        - ML Architectures
        - CPU / GPU
        - Other
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference (optional)
      description: A URL with specs/diagrams that would help the model get it right.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything important — key subsystems to capture, or (for an existing scene) what looks wrong.
