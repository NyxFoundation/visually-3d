name: Publish to npm

# Publishes when you push a version tag (e.g. `v0.9.0`), or manually via the
# Actions tab. Requires an `NPM_TOKEN` secret (an npm automation/granular token
# with publish rights). Publishing uses npm provenance, which needs the
# id-token permission below.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version $PKG_VERSION matches tag"

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
